plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.max.guardpet'
    compileSdk 34

    defaultConfig {
        applicationId 'com.max.guardpet'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "1.1.9"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // no third-party dependencies; framework APIs only
}
